spring:

  application:
    name: AIKP Platform

  profiles:
    default: dev

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

springdoc:

  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

logging:

  level:
    root: INFO