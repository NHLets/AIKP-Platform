spring:

  datasource:

    url: ${DATABASE_URL}

    username: ${DATABASE_USERNAME}

    password: ${DATABASE_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:

    open-in-view: false

    hibernate:
      ddl-auto: validate

  flyway:

    enabled: true

server:

  port: ${SERVER_PORT:8080}

logging:

  level:

    root: INFO